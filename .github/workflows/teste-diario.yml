# Teste diário do Minhas Finanças.
# Se algo falhar, o GitHub manda um e-mail para o dono do repositório.
name: Teste diário

on:
  schedule:
    - cron: '0 10 * * *'   # todo dia às 7h (horário de Fortaleza)
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'testes/**', '.github/workflows/**']
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: teste-diario
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar o navegador de teste
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Testar o app (conta de teste, servidor simulado)
        run: node testes/diario.js

      - name: Conferir se o site no ar está na mesma versão
        run: |
          v=$(grep -o 'name="app-versao" content="[^"]*"' index.html | head -1)
          for i in $(seq 1 20); do
            code=$(curl -sSL -o site.html -w '%{http_code}' -H 'Cache-Control: no-cache' "https://guilherme3co.github.io/financeiro/index.html?t=$(date +%s)" || echo erro)
            no_ar=$(grep -o 'name="app-versao" content="[^"]*"' site.html 2>/dev/null | head -1 || true)
            if [ "$no_ar" = "$v" ]; then echo "Site no ar: $v"; exit 0; fi
            if [ "$i" = "1" ] || [ "$i" = "20" ]; then echo "::warning::Tentativa $i: HTTP $code, no ar [$no_ar], esperado [$v], tamanho $(wc -c < site.html 2>/dev/null)"; fi
            sleep 30
          done
          exit 1

      - name: Manter o Supabase acordado (e conferir se responde)
        env:
          SB_URL: https://ezivqczibtsqqqzpzcdh.supabase.co
          SB_KEY: sb_publishable_YhQFxwQmRruAh7aDATquFQ_sR81kg-Z   # chave pública do app, não é segredo
        run: |
          curl -fsS -X POST "$SB_URL/rest/v1/rpc/ping" -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{}'
          echo

      - name: Manter o teste diário ligado (o GitHub desliga após 60 dias sem mudanças)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" = "01" ]; then
            date -u +%F > testes/ultimo-teste.txt
            git config user.name "teste-diario"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add testes/ultimo-teste.txt
            git commit -m "Teste diário: manter ligado [skip ci]" && git push
          fi
