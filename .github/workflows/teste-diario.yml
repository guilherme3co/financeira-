# Teste diário e publicação do Minhas Finanças.
# - Todo dia às 7h: testa o app, confere o site no ar e mantém o Supabase acordado.
# - A cada mudança enviada: testa primeiro e só publica se tudo passar
#   (quando o GitHub Pages estiver em "Source: GitHub Actions").
# Se algo falhar, o GitHub manda um e-mail para o dono do repositório.
name: Teste diário

on:
  schedule:
    - cron: '0 10 * * *'   # todo dia às 7h (horário de Fortaleza)
  push:
    branches: [main]
  workflow_dispatch:       # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: teste-diario
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Conferir se index.html foi gerado a partir de src/
        run: python3 build.py --check

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar o navegador de teste
        run: |
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium

      - name: Testar o app (conta de teste, servidor simulado)
        run: node testes/diario.js

      - name: Conferir se o site no ar está na mesma versão
        if: github.event_name == 'schedule'
        run: bash testes/site-no-ar.sh

      - name: Manter o Supabase acordado (e conferir se responde)
        env:
          SB_URL: https://ezivqczibtsqqqzpzcdh.supabase.co
          SB_KEY: sb_publishable_YhQFxwQmRruAh7aDATquFQ_sR81kg-Z   # chave pública do app, não é segredo
        run: |
          curl -fsS -X POST "$SB_URL/rest/v1/rpc/ping" -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{}'
          echo

      - name: Manter o teste diário ligado (o GitHub desliga após 60 dias sem mudanças)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" = "01" ]; then
            date -u +%F > testes/ultimo-teste.txt
            git config user.name "teste-diario"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add testes/ultimo-teste.txt
            git commit -m "Teste diário: manter ligado [skip ci]" && git push
          fi

  publicar:
    needs: testar
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v5

      - name: Ver como o site é publicado
        id: modo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo desconhecido)
          echo "modo=$m" >> "$GITHUB_OUTPUT"
          if [ "$m" = "workflow" ]; then echo "Publicação só depois dos testes: ligada ✅";
          else echo "::notice::O site ainda publica direto a cada envio. Para publicar só depois dos testes: Settings → Pages → Source → GitHub Actions."; fi

      - name: Preparar arquivos do site
        if: steps.modo.outputs.modo == 'workflow'
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.json icon.svg icon-192.png privacidade.html termos.html fonts ocr pdf qr _site/

      - uses: actions/configure-pages@v5
        if: steps.modo.outputs.modo == 'workflow'

      - uses: actions/upload-pages-artifact@v3
        if: steps.modo.outputs.modo == 'workflow'
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        if: steps.modo.outputs.modo == 'workflow'

      - name: Conferir se o site no ar está na versão nova
        run: bash testes/site-no-ar.sh
